name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/soundbutton app/src/main/res/raw
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.kt app/src/main/java/com/example/soundbutton/MainActivity.kt
          mv sound.mp3 app/src/main/res/raw/sound.mp3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SoundButton-apk
          path: app/build/outputs/apk/debug/app-debug.apk
